<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button effect — for Bagachi</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page">
      <div
        class="page__bg"
        style="background-image: url('assets/background.png')"
        role="img"
        aria-label="Floral background"
      ></div>

      <div class="home-button-wrap">
        <a
          id="home-button"
          class="home-button"
          href="welcome.html"
          aria-label="Open gift for Bagachi"
        >
          <div id="cursor-ring" class="cursor-ring" aria-hidden="true"></div>
          <span class="home-button__gradient" aria-hidden="true"></span>
          <span class="home-button__pulse" aria-hidden="true"></span>
          <span class="home-button__glow" aria-hidden="true"></span>
          <p class="home-button__label">for bagachi</p>
        </a>
      </div>
    </main>

    <script src="js/home.js"></script>
  </body>
</html>
